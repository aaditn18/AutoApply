name: review-listener

# Reacts to /approve, /reject, /snooze comments on review-queue issues.
# Gated hard: only fires when the comment body starts with a slash command
# AND the commenter is the repo owner (case-insensitive). Every path that
# could submit is still bound by DRY_RUN in config.

on:
  issue_comment:
    types: [created, edited]

concurrency:
  # Serialize with the main pipeline to avoid SQLite write races.
  group: autoapply-pipeline
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  handle:
    # Pre-filter in the YAML layer so we don't spin a runner for chit-chat.
    if: |
      github.event.issue.pull_request == null &&
      (
        startsWith(github.event.comment.body, '/approve') ||
        startsWith(github.event.comment.body, '/reject')  ||
        startsWith(github.event.comment.body, '/snooze')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: src
      DRY_RUN: "true"
      ALLOWED_ACTOR: ${{ github.repository_owner }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GH_ISSUES_PAT: ${{ secrets.GH_ISSUES_PAT }}
      GH_REPO_OWNER: ${{ github.repository_owner }}
      GH_REPO_NAME: ${{ github.event.repository.name }}

    steps:
      - name: Reject commenter that isn't repo owner
        if: ${{ github.event.comment.user.login != github.repository_owner }}
        run: |
          echo "::warning::Ignoring slash command from non-owner '${{ github.event.comment.user.login }}'."
          exit 0

      # Two-step checkout — same pattern as pipeline.yml.
      # SUBMODULE_PAT is scoped to the private resumes submodule only,
      # so we MUST NOT pass it as the AutoApply checkout token (it 403s).
      # Use the default GITHUB_TOKEN for AutoApply, then init the
      # submodule manually with SUBMODULE_PAT via `insteadOf`.
      - name: Checkout AutoApply
        if: ${{ github.event.comment.user.login == github.repository_owner }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Init resumes submodule
        if: ${{ github.event.comment.user.login == github.repository_owner }}
        run: |
          git config --global \
            url."https://x-access-token:${{ secrets.SUBMODULE_PAT }}@github.com/".insteadOf \
            "https://github.com/"
          git submodule update --init --depth 1 resumes

      - name: Set up Python 3.11
        if: ${{ github.event.comment.user.login == github.repository_owner }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        if: ${{ github.event.comment.user.login == github.repository_owner }}
        run: |
          pip install --upgrade uv
          uv pip install --system -e .

      - name: Initialise DB schema (idempotent)
        if: ${{ github.event.comment.user.login == github.repository_owner }}
        run: python -m autoapply.cli init-db

      - name: Apply review decision
        if: ${{ github.event.comment.user.login == github.repository_owner }}
        run: python -m autoapply.cli review-handle --event "$GITHUB_EVENT_PATH"

      - name: Commit state changes
        if: ${{ github.event.comment.user.login == github.repository_owner }}
        run: |
          git config user.name  "autoapply-bot"
          git config user.email "autoapply-bot@users.noreply.github.com"
          git add state/jobs.sqlite 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "state: review action on issue #${{ github.event.issue.number }}"
            git push || (git pull --rebase && git push)
          fi
