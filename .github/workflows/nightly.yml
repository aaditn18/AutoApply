name: nightly

# Runs once a day at 05:00 UTC (01:00 ET). Cheap housekeeping only:
#   - VACUUM + ANALYZE on SQLite
#   - Archive jobs older than 90 days
#   - Rebuild profile.json (picks up any new submodule SHA bumps)
#   - Post a daily security report as an Issue comment / pinned digest
#
# Budget: ~3 min per run × 30 days = ~90 min/mo.

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

concurrency:
  group: autoapply-pipeline
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  housekeeping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: src
      DRY_RUN: "true"
      GH_ISSUES_PAT: ${{ secrets.GH_ISSUES_PAT }}
      GH_REPO_OWNER: ${{ github.repository_owner }}
      GH_REPO_NAME: ${{ github.event.repository.name }}

    steps:
      # Two-step checkout — same pattern as pipeline.yml.
      # SUBMODULE_PAT is scoped to the private resumes submodule only,
      # so we MUST NOT pass it as the AutoApply checkout token (it 403s).
      # Use the default GITHUB_TOKEN for AutoApply, then init the
      # submodule manually with SUBMODULE_PAT via `insteadOf`.
      - name: Checkout AutoApply
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Init resumes submodule
        run: |
          git config --global \
            url."https://x-access-token:${{ secrets.SUBMODULE_PAT }}@github.com/".insteadOf \
            "https://github.com/"
          git submodule update --init --depth 1 resumes

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: |
          pip install --upgrade uv
          uv pip install --system -e .

      - name: Initialise DB schema (idempotent)
        run: python -m autoapply.cli init-db

      - name: Rebuild profile.json (picks up submodule bumps)
        run: python -m autoapply.cli profile-build
        continue-on-error: true

      - name: VACUUM + ANALYZE
        run: |
          python - <<'PY'
          import sqlite3, os
          db = "state/jobs.sqlite"
          if not os.path.exists(db):
              print("No DB yet — skipping vacuum.")
              raise SystemExit(0)
          with sqlite3.connect(db) as c:
              c.execute("VACUUM;")
              c.execute("ANALYZE;")
          print("vacuum + analyze ok")
          PY

      - name: Archive jobs older than 90 days
        run: |
          python - <<'PY'
          import sqlite3, os
          from datetime import datetime, timedelta, timezone
          db = "state/jobs.sqlite"
          if not os.path.exists(db):
              raise SystemExit(0)
          cutoff = (datetime.now(timezone.utc) - timedelta(days=90)).isoformat()
          with sqlite3.connect(db) as c:
              cur = c.execute(
                  "UPDATE jobs SET status='archived' "
                  "WHERE created_at < ? AND status NOT IN ('applied_ok','applied_failed','archived')",
                  (cutoff,),
              )
              print(f"archived {cur.rowcount} stale jobs")
              c.commit()
          PY

      - name: Security report (7-day window)
        run: python -m autoapply.cli security-report --days 7 > state/security_report_weekly.json
        continue-on-error: true

      - name: Commit state changes
        if: always()
        run: |
          git config user.name  "autoapply-bot"
          git config user.email "autoapply-bot@users.noreply.github.com"
          git add state/jobs.sqlite state/profile.json state/security_report_weekly.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "state: nightly housekeeping ${{ github.run_id }}"
            git push || (git pull --rebase && git push)
          fi
