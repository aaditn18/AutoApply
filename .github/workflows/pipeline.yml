name: pipeline

# Combined ingest → score → apply pipeline.
# Runs every 6 hours. Serialized via the `autoapply-pipeline` concurrency
# group so two runs never race on state/jobs.sqlite.

on:
  schedule:
    # 00:00, 06:00, 12:00, 18:00 UTC
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run in DRY_RUN mode (no submissions)"
        type: boolean
        default: true
      skip_apply:
        description: "Skip the apply stage (ingest + score only)"
        type: boolean
        default: false
      test_safe_only:
        description: "Only ingest test_safe boards (skip live_only)"
        type: boolean
        default: false

concurrency:
  group: autoapply-pipeline
  cancel-in-progress: false

permissions:
  contents: write   # auto-commit state/jobs.sqlite
  issues: write     # post review-queue issues

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: src
      # ── Safety ────────────────────────────────────────────────────
      # DRY_RUN must default to TRUE on schedule. The previous form
      # `inputs.dry_run == false && 'false' || 'true'` evaluated to
      # 'false' on cron because GitHub Actions coerces null == false to
      # TRUE. The fix below requires the workflow to be a manual
      # dispatch AND inputs.dry_run be explicitly false to disable.
      DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run == false) && 'false' || 'true' }}
      # Pull from BOTH test_safe and live_only on cron — only TEST_SAFE_ONLY
      # gating that mattered was real-submit safety, and DRY_RUN above
      # already covers that. With this off, ingest sees all ~3k postings
      # across companies.yml so dedup finds genuinely new ones.
      TEST_SAFE_ONLY: ${{ inputs.test_safe_only == true && 'true' || 'false' }}
      # ── Secrets exposed to Pydantic Settings ─────────────────────
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GH_ISSUES_PAT: ${{ secrets.GH_ISSUES_PAT }}
      GH_REPO_OWNER: ${{ github.repository_owner }}
      GH_REPO_NAME: ${{ github.event.repository.name }}
      AES_KEY_B64: ${{ secrets.AES_KEY_B64 }}
      # IMAP — required for Greenhouse OTP email-verification flow.
      # Without these, every Greenhouse form that triggers OTP fails with
      # "email verification required but IMAP credentials not configured".
      IMAP_EMAIL: ${{ secrets.IMAP_EMAIL }}
      IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
      # Captcha solver — used by the submitter when a captcha wall fires.
      CAPTCHA_SOLVER: ${{ secrets.CAPTCHA_SOLVER }}
      CAPTCHA_SOLVER_API_KEY: ${{ secrets.CAPTCHA_SOLVER_API_KEY }}
      CAPTCHA_SOLVER_TIMEOUT: ${{ secrets.CAPTCHA_SOLVER_TIMEOUT }}

    steps:
      # Step 1: checkout AutoApply with the default GITHUB_TOKEN (which has
      # write access to this repo). SUBMODULE_PAT is NOT used here — it only
      # covers the private resume submodule, not AutoApply itself.
      - name: Checkout AutoApply
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Step 2: init the resumes submodule using SUBMODULE_PAT (fine-grained
      # PAT with read-only access to aaditn18/aadit_nilay_resume_swe).
      - name: Init resumes submodule
        run: |
          git config --global \
            url."https://x-access-token:${{ secrets.SUBMODULE_PAT }}@github.com/".insteadOf \
            "https://github.com/"
          git submodule update --init --depth 1 resumes

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install uv
        run: pip install --upgrade uv

      - name: Install project + Playwright browser
        run: |
          uv pip install --system -e .
          playwright install --with-deps chromium

      - name: Initialise DB schema (idempotent)
        run: python -m autoapply.cli init-db

      - name: Rebuild profile.json from submodule
        run: python -m autoapply.cli profile-build
        continue-on-error: true

      # ── Ingest ────────────────────────────────────────────────────
      # `--limit` is a hard cap across iteration order — too low and
      # the same first-N boards are pulled forever and dedup hides that
      # nothing new is ingested. With TEST_SAFE_ONLY=false the pool is
      # ~3k postings; bump to 5000 so genuinely new ones land.

      - name: Ingest — Greenhouse
        run: python -m autoapply.cli ingest --source greenhouse --limit 5000
        continue-on-error: true

      - name: Ingest — Lever
        run: python -m autoapply.cli ingest --source lever --limit 5000
        continue-on-error: true

      - name: Ingest — Ashby
        run: python -m autoapply.cli ingest --source ashby --limit 5000
        continue-on-error: true

      - name: Score + hard filters + track pick
        run: python -m autoapply.cli score --limit 1000
        continue-on-error: true

      - name: Apply (DRY_RUN respects env)
        if: ${{ inputs.skip_apply != true }}
        run: python -m autoapply.cli apply
        continue-on-error: true

      - name: Security report (injection attempts in window)
        run: python -m autoapply.cli security-report --days 1 > state/security_report_latest.json
        continue-on-error: true

      - name: Upload dry-run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dry-runs-${{ github.run_id }}
          path: state/dry_runs/
          retention-days: 14
          if-no-files-found: ignore

      - name: Commit state changes
        if: always()
        run: |
          git config user.name  "autoapply-bot"
          git config user.email "autoapply-bot@users.noreply.github.com"
          git add state/jobs.sqlite state/security_report_latest.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "state: pipeline run ${{ github.run_id }}"
            # Retry push once on race.
            git push || (git pull --rebase && git push)
          fi
