name: pipeline

# Combined ingest → score → apply pipeline.
# Runs every 6 hours. Serialized via the `autoapply-pipeline` concurrency
# group so two runs never race on state/jobs.sqlite.

on:
  schedule:
    # 00:00, 06:00, 12:00, 18:00 UTC
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run in DRY_RUN mode (no submissions)"
        type: boolean
        default: true
      skip_apply:
        description: "Skip the apply stage (ingest + score only)"
        type: boolean
        default: false

concurrency:
  group: autoapply-pipeline
  cancel-in-progress: false

permissions:
  contents: write   # auto-commit state/jobs.sqlite
  issues: write     # post review-queue issues

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: src
      # Secrets surface as env vars for Pydantic Settings.
      DRY_RUN: ${{ inputs.dry_run == false && 'false' || 'true' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GH_ISSUES_PAT: ${{ secrets.GH_ISSUES_PAT }}
      GH_REPO_OWNER: ${{ github.repository_owner }}
      GH_REPO_NAME: ${{ github.event.repository.name }}
      AES_KEY_B64: ${{ secrets.AES_KEY_B64 }}

    steps:
      - name: Checkout AutoApply + resumes submodule
        uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.SUBMODULE_PAT }}
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install uv
        run: pip install --upgrade uv

      - name: Install project (no browser deps for fast path)
        run: |
          uv pip install --system -e .

      - name: Initialise DB schema (idempotent)
        run: python -m autoapply.cli init-db

      - name: Rebuild profile.json from submodule
        run: python -m autoapply.cli profile-build
        continue-on-error: true

      - name: Ingest — Greenhouse
        run: python -m autoapply.cli ingest --source greenhouse --limit 200
        continue-on-error: true

      - name: Ingest — Lever
        run: python -m autoapply.cli ingest --source lever --limit 200
        continue-on-error: true

      - name: Score + hard filters + track pick
        run: python -m autoapply.cli score --limit 400
        continue-on-error: true

      - name: Apply (DRY_RUN respects env)
        if: ${{ inputs.skip_apply != true }}
        run: python -m autoapply.cli apply
        continue-on-error: true

      - name: Security report (injection attempts in window)
        run: python -m autoapply.cli security-report --days 1 > state/security_report_latest.json
        continue-on-error: true

      - name: Upload dry-run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dry-runs-${{ github.run_id }}
          path: state/dry_runs/
          retention-days: 14
          if-no-files-found: ignore

      - name: Commit state changes
        if: always()
        run: |
          git config user.name  "autoapply-bot"
          git config user.email "autoapply-bot@users.noreply.github.com"
          git add state/jobs.sqlite state/security_report_latest.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "state: pipeline run ${{ github.run_id }}"
            # Retry push once on race.
            git push || (git pull --rebase && git push)
          fi
