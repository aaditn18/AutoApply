# -- Freeform essays (non-LLM) ----------------------------------------------

why_role:
  swe: |
    I'm drawn to backend systems and developer-platform problems. My PayPal
    work optimizing $1.5B/day transaction pipelines and my full-stack work
    at Sociable AI give me a foundation in scalable, low-latency design, and
    I'm excited to keep building systems at that scale.
  ml: |
    My PSSG research on LLM-based performance explanations (submitted to
    SC '26) and my CVPRW 2026 paper reflect my focus on applied ML at scale.
    I'm excited to work on problems where model quality and production
    latency both matter.
  hpc: |
    I've written CUDA kernels for rolling-window signal processing and
    profiled Rodinia benchmarks with Nsight Compute as part of my PSSG work.
    GPU and systems performance is where I spend most of my time and where
    I want to keep growing.
  quant: |
    My quant-dev work spans MPI + OpenMP Monte Carlo simulations, CUDA
    signal kernels, and C++ backtesting engines with SIMD and lock-free
    queues. That low-latency research-engineering profile is exactly the
    kind of work I want to do full-time.

# -- Referral / source ------------------------------------------------------

how_heard_about:
  _default: "Company careers page"

# Yes/No — "Do you know someone at <company>?" / "Were you referred?"
# Default "No" when no contact is on record. If Profile later tracks a
# per-company referral map, that source-of-truth will override this.
referral_know_someone:
  _default: "No"

# Name of the referring employee. Empty string → forms that require a
# referral name accept the blank (Greenhouse / Lever treat the field as
# optional when there's no known referrer). Override via Profile when a
# specific contact applies for a given company.
referral_name:
  _default: ""

# Email of the referring employee. Same treatment as referral_name.
referral_email:
  _default: ""

