# AutoApply — Deterministic Answer Bank
#
# Keys are QuestionType enum values (see src/autoapply/answers/types.py).
# Each entry may specify `_default` and/or per-track overrides (swe/ml/hpc/quant).
# Per-track values win over `_default`.
#
# RULES:
#   * Never put secrets, SSN, DOB, or bank info here.
#   * Never put values sourced from Profile here (email, phone, GPA, school,
#     YOE, etc.) — those come from state/profile.json at resolution time.
#   * LLM_REQUIRED and REVIEW_REQUIRED types are intentionally absent; the
#     bank is only consulted for types outside those policy sets.
#
# User: review every value before flipping DRY_RUN off, especially the
# visa / sponsorship block and salary numbers.

# -- Work authorization ------------------------------------------------------
# F-1 student with post-completion OPT after May 20 2026 graduation.
# OPT authorizes US work without employer sponsorship for up to 12 months
# (24-month STEM extension thereafter), but H-1B sponsorship is eventually
# needed for long-term employment.

work_authorized_us:
  _default: "Yes"            # OPT is valid US work authorization

require_sponsorship_now:
  _default: "No"             # OPT covers the initial employment period

require_sponsorship_future:
  _default: "Yes"            # H-1B sponsorship will be required after OPT

visa_status:
  _default: "F-1 (OPT)"     # snap_to_option will match "F-1", "OPT", etc.

citizenship:
  # Country of citizenship — long-form fields ask "What is your citizenship?"
  _default: "India"

us_citizen:
  # Yes/No — "Are you a U.S. citizen?". Aadit is an Indian citizen on F-1 OPT,
  # so this is always No. Do NOT confuse with work authorization
  # (work_authorized_us = Yes, because OPT IS valid US work auth).
  _default: "No"

