# AutoApply — Deterministic Answer Bank
#
# Keys are QuestionType enum values (see src/autoapply/answers/types.py).
# Each entry may specify `_default` and/or per-track overrides (swe/ml/hpc/quant).
# Per-track values win over `_default`.
#
# RULES:
#   * Never put secrets, SSN, DOB, or bank info here.
#   * Never put values sourced from Profile here (email, phone, GPA, school,
#     YOE, etc.) — those come from state/profile.json at resolution time.
#   * LLM_REQUIRED and REVIEW_REQUIRED types are intentionally absent; the
#     bank is only consulted for types outside those policy sets.
#
# User: review every value before flipping DRY_RUN off, especially the
# visa / sponsorship block and salary numbers.

# -- Work authorization ------------------------------------------------------
# F-1 student with post-completion OPT after May 20 2026 graduation.
# OPT authorizes US work without employer sponsorship for up to 12 months
# (24-month STEM extension thereafter), but H-1B sponsorship is eventually
# needed for long-term employment.

# NOTE: work_authorized_us, require_sponsorship_now/future, visa_status,
# citizenship, us_citizen, and the EEO demographic fields below are now
# PROFILE_SOURCED (see src/autoapply/answers/types.py). The canonical
# values live on ``Profile`` in ``state/profile.json`` so they're
# consistent across every resume track. The bank entries below are
# kept as a *fallback* — if ``profile.json`` is missing a field, the
# resolver falls through to the bank for that field only.

work_authorized_us:
  _default: "Yes"            # OPT is valid US work authorization

require_sponsorship_now:
  _default: "No"             # OPT covers the initial employment period

require_sponsorship_future:
  _default: "Yes"            # H-1B sponsorship will be required after OPT

visa_status:
  # Long-form visa status string. Greenhouse/Lever questions asking
  # "What is your visa / work authorization status?" get this back.
  # For simple checkbox lists (Yes/No on F-1, Yes/No on OPT), the
  # option matcher still picks the correct verbatim option.
  _default: "F-1 visa OPT (STEM extension till 2029)"

# Yes/No — "Do you have permanent work authorization in the US?"
# (i.e., green-card-level permanent authorization). Aadit is on F-1
# OPT which is time-limited, NOT permanent.
permanent_work_authorization:
  _default: "No"

citizenship:
  # Country of citizenship — long-form fields ask "What is your citizenship?"
  _default: "India"

us_citizen:
  # Yes/No — "Are you a U.S. citizen?". Aadit is an Indian citizen on F-1 OPT,
  # so this is always No. Do NOT confuse with work authorization
  # (work_authorized_us = Yes, because OPT IS valid US work auth).
  _default: "No"

# Yes/No — "Have you served in the US Armed Forces?" / "Military service?"
# Aadit hasn't served, so always No. Don't confuse with veteran status
# (``demo_veteran``), which is an EEO self-ID question with its own phrasing.
military_service:
  _default: "No"

# -- Experience (general) ---------------------------------------------------

yoe_general:
  _default: "2"              # internship + research; update if asked FTE-only

# -- Location / logistics ---------------------------------------------------

current_location:
  _default: "College Park, MD"

current_city:
  _default: "College Park"

current_state:
  _default: "MD"

current_zip:
  _default: "20740"

street_address:
  _default: "8150 Baltimore Ave"

address_line_2:
  _default: "Apt. 308-C"

full_address:
  _default: "8150 Baltimore Ave, Apt. 308-C, College Park, MD 20740"

willing_to_relocate:
  _default: "Yes"

# "Are you willing to work from our Sterling, VA office?" /
# "This role requires you to be based out of X" — subjective
# willingness questions. Per policy, we default to Yes; the candidate
# can always decline later. Don't confuse with ``willing_to_relocate``
# (generic Yes/No relocation) — this one targets the specific "from
# our location" variant.
willing_work_location:
  _default: "Yes"

available_start_date:
  _default: "June 2026"      # after May 20 2026 graduation

notice_period:
  _default: "None — new graduate, available June 2026 or later."

graduation_date:
  _default: "May 2026"       # displayed on forms that ask separately

