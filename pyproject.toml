[project]
name = "autoapply"
version = "0.1.0"
description = "Autonomous job-application agent for Aadit Nilay"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "httpx>=0.27",
    "curl-cffi>=0.7",
    "playwright>=1.44",
    "playwright-stealth>=1.0.6",
    "fake-useragent>=1.5",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "sentence-transformers>=3.0",
    "pyyaml>=6.0",
    "google-genai>=0.3",
    "anthropic>=0.34",
    "cryptography>=43.0",
    "python-dateutil>=2.9",
]

[project.scripts]
autoapply = "autoapply.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["E501"]  # line-length handled by formatter
