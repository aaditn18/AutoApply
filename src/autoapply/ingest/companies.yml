# AutoApply — board token registry
#
# PHILOSOPHY (read before editing):
#   test_safe:  Companies used while validating the pipeline.
#               Either (a) require US citizenship so F-1 applications will be
#               rejected regardless, or (b) genuinely low-stakes companies
#               where a malformed application doesn't burn a bridge.
#               Keep this list SMALL and targeted until the pipeline is proven.
#
#   live_only:  High-value targets — quant funds, elite AI labs, FAANG+,
#               top HPC shops. Only ingested when TEST_SAFE_ONLY=false.
#               DO NOT flip until:
#                 1. DRY_RUN=false
#                 2. form-field mapping verified on ≥5 test_safe runs
#                 3. answer bank fully confirmed
#
# ── ATS COVERAGE NOTE ────────────────────────────────────────────────────────
# Most major defense contractors listed in the original design doc
# (Lockheed Martin, Raytheon/RTX, Northrop Grumman, Boeing, GDIT, MITRE,
# Booz Allen Hamilton, NASA) use Workday, Brassring, or USAJobs — NOT
# Greenhouse or Lever. They are unreachable until a Workday connector is built.
# The `test_safe` section uses the subset of defense/gov contractors that DO
# post on Greenhouse/Lever, supplemented with low-stakes SaaS/adtech companies.
# ─────────────────────────────────────────────────────────────────────────────

greenhouse:

