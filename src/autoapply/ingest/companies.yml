# Seed list of board tokens for Greenhouse + Lever.
#
# - `greenhouse:` entries are the slug after boards.greenhouse.io/<slug>
#   e.g. boards.greenhouse.io/airbnb → "airbnb"
# - `lever:` entries are the slug after jobs.lever.co/<slug>
#   e.g. jobs.lever.co/netflix → "netflix"
#
# Keep this list focused on US-headquartered firms with active new-grad /
# early-career SWE, ML, HPC, and quant postings. Tokens are case-sensitive.
# Run `autoapply ingest --source greenhouse --board <slug>` to sanity-check
# before adding at scale.

greenhouse:
  # -- Big Tech / unicorns ------------------------------------------------
  - airbnb
  - asana
  - dropbox
  - figma
  - gitlab
  - instacart
  - lyft
  - notion
  - pinterest
  - reddit
  - robinhood
  - samsara
  - snowflake
  - stripe
  - twilio
  - zoominfo
  # -- AI labs -----------------------------------------------------------
