# AutoApply — board token registry
#
# Two sections per ATS:
#   test_safe:  Used in both DRY_RUN testing AND live runs.
#               Lower-stakes companies — OK to surface in the review queue
#               even before you've fully validated the pipeline.
#   live_only:  Only ingested when TEST_SAFE_ONLY=false in Settings.
#               Your highest-priority targets (quant funds, elite HPC shops,
#               top AI labs). Don't touch these until you're confident
#               the pipeline is working correctly.
#
# Token = the slug after boards.greenhouse.io/<slug> or jobs.lever.co/<slug>.
# Run `autoapply ingest --source greenhouse --board <slug>` to sanity-check
# a new token before adding it here.

greenhouse:

  test_safe:
    # -- Standard SWE / product companies ------------------------------------
    - airbnb
    - asana
    - dropbox
    - figma
    - gitlab
    - instacart
    - lyft
    - notion
    - pinterest
    - reddit
    - robinhood
    - samsara
    - snowflake
    - stripe
    - twilio
    - zoominfo
    - rippling
    - confluent
    - fivetran
    - hashicorp
    - mongodb
    - vercel
    - anyscale
    # -- AI / ML (not top-tier labs) -----------------------------------------
    - huggingface
    - perplexity

  live_only:
